name: Build container
on:
  push:
    tags:
      - "v*"
  # Оставляем возможность запустить сборку руками, если приспичит
  workflow_dispatch:
    inputs:
      container_tag:
        description: Tag for container
        default: "latest"
        required: true

permissions:
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest

    env:
      CONTAINER_NAME: ghcr.io/${{ github.repository }}
      BUILD_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
      RAW_CONTAINER_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.container_tag || 'latest' }}

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: |
            ${{ env.CONTAINER_NAME }}:${{ env.RAW_CONTAINER_TAG }}
            ${{ env.CONTAINER_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RAW_CONTAINER_TAG }}