name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: go vet + go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (includes loopback WireGuard / AmneziaWG tunnel tests)
        run: go test -race -count=1 ./...
      - name: Build
        run: make build
      - name: Config test of the example
        run: ./build/wireproxy -n -c examples/awg.conf.example
